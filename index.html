<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#062b3b" />
  <meta name="description" content="ClassPilot Free Preview. Plan. Teach. Adjust. Your classroom command center builds itself." />
  <link rel="canonical" href="https://classpilot-free.pages.dev/" />
  <title>ClassPilot | Free Preview</title>
  <style>
    :root{--navy:#062b3b;--navy2:#0b4656;--teal:#18b9a6;--teal2:#49d7bb;--blue:#2f6df6;--ink:#09283a;--muted:#627884}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    body{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 16% 14%,rgba(73,215,187,.24),transparent 28%),radial-gradient(circle at 82% 18%,rgba(47,109,246,.20),transparent 30%),linear-gradient(145deg,var(--navy),var(--navy2));overflow-x:hidden}
    .shell{width:min(1100px,100%);position:relative}.glow{position:absolute;inset:auto 8% -22px 8%;height:120px;background:rgba(24,185,166,.22);filter:blur(45px);border-radius:50%}
    .card{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(300px,.95fr);gap:42px;align-items:center;padding:54px;border-radius:34px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.48);box-shadow:0 30px 90px rgba(0,0,0,.28);overflow:hidden}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:#eaf3ff;color:#14386a;font-weight:800;font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:28px}.dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}
    h1{font-size:clamp(3rem,7vw,5.6rem);line-height:.92;margin:0;letter-spacing:-.055em;color:#082b4d}h1 span{color:var(--teal)}
    .tagline{font-size:clamp(1.5rem,3vw,2.15rem);font-weight:800;margin:24px 0 10px;letter-spacing:-.025em}.sub{font-size:clamp(1rem,1.8vw,1.2rem);line-height:1.65;color:var(--muted);max-width:620px;margin:0 0 30px}
    .actions{display:flex;flex-wrap:wrap;align-items:center;gap:16px}.launch{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:58px;padding:0 25px;border-radius:16px;color:#fff;font-size:1.05rem;font-weight:850;background:linear-gradient(135deg,var(--blue),var(--teal));box-shadow:0 15px 30px rgba(47,109,246,.22);text-decoration:none;transition:.18s}.launch:hover{transform:translateY(-2px);box-shadow:0 18px 36px rgba(47,109,246,.30)}.micro{font-size:.9rem;color:#6a7e88;line-height:1.45;max-width:260px}
    .visual{display:flex;justify-content:center;align-items:center}.logo-wrap{width:min(390px,90%);aspect-ratio:1;display:grid;place-items:center;border-radius:38px;background:linear-gradient(145deg,#f7fffd,#eaf5ff);box-shadow:inset 0 0 0 1px #e3eef3,0 24px 55px rgba(7,43,58,.12);padding:28px}.logo-wrap img{width:100%;height:100%;object-fit:contain}
    .footer{display:flex;justify-content:space-between;gap:16px;color:rgba(255,255,255,.72);font-size:.84rem;padding:18px 10px 0;flex-wrap:wrap}.footer strong{color:#fff}.footer a{color:#fff;text-decoration:none;margin-left:14px}.footer a:hover{text-decoration:underline}
    @media(max-width:820px){body{padding:18px}.card{grid-template-columns:1fr;padding:34px 24px;gap:32px}.visual{order:-1}.logo-wrap{width:min(300px,78vw)}.footer{flex-direction:column;text-align:center;align-items:center}.footer a{margin:0 7px}.actions{align-items:flex-start;flex-direction:column}.micro{max-width:none}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="glow"></div>
    <section class="card">
      <div>
        <span class="pill"><span class="dot"></span> Free Preview</span>
        <h1>Class<span>Pilot</span></h1>
        <div class="tagline">Plan. Teach. Adjust.</div>
        <p class="sub">Your classroom command center builds itself.</p>
        <div class="actions">
          <a class="launch" href="https://script.google.com/macros/s/AKfycbwvNSx-CC_oPTvkyyQWc6aPCeYyOAk_zF0ttnToIla-K5ppFZuexET7oW5zW74nFk6k-g/exec" target="_blank" rel="noopener noreferrer">Launch ClassPilot →</a>
          <div class="micro">Sign in with Google, complete the short setup, and ClassPilot creates your personalized workspace.</div>
        </div>
      </div>
      <div class="visual"><div class="logo-wrap"><img src="logo.svg" alt="ClassPilot logo" /></div></div>
    </section>
    <div class="footer"><div><strong>ClassPilot Free Preview</strong></div><div>Simple setup. Your classroom. Your data. <a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a></div></div>
  </main>
</body>
</html>
